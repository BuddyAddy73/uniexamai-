<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIEX AI — Log in</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05091A;--bg-s:#0B1121;--bg-c:#0F1728;
  --indigo:#6366F1;--ind-d:rgba(99,102,241,.12);--ind-b:rgba(99,102,241,.22);
  --cyan:#22D3EE;--text:#EEF2FF;--text-2:#94A3B8;--text-3:#3D4E6B;
  --border:rgba(255,255,255,.07);
  --ff-d:'Space Grotesk',sans-serif;--ff-b:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);color:var(--text);font-family:var(--ff-b);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
body::before{
  content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(99,102,241,.15) 0%,transparent 70%);
}
.card{
  width:380px;background:var(--bg-s);border:1px solid var(--border);
  border-radius:16px;padding:36px 32px;position:relative;z-index:1;
  box-shadow:0 30px 80px rgba(0,0,0,.4);
}
.logo{
  font-family:var(--ff-d);font-size:1.1rem;font-weight:700;letter-spacing:.08em;
  text-align:center;margin-bottom:28px;
}
.logo em{font-style:normal;color:var(--indigo);}
h1{font-family:var(--ff-d);font-size:1.3rem;font-weight:600;margin-bottom:6px;text-align:center;}
.sub{font-size:.82rem;color:var(--text-2);text-align:center;margin-bottom:28px;}
.field{margin-bottom:14px;}
label{font-size:.75rem;color:var(--text-2);display:block;margin-bottom:6px;}
input{
  width:100%;padding:11px 14px;background:var(--bg-c);
  border:1px solid var(--border);border-radius:8px;color:var(--text);
  font-size:.875rem;outline:none;transition:border-color .2s;
}
input:focus{border-color:var(--ind-b);}
.submit{
  width:100%;padding:12px;margin-top:8px;border-radius:8px;
  background:var(--indigo);color:#fff;border:none;
  font-size:.875rem;font-weight:500;cursor:pointer;transition:all .2s;
}
.submit:hover{background:#4F46E5;box-shadow:0 6px 24px rgba(99,102,241,.4);}
.submit:disabled{opacity:.5;cursor:not-allowed;}
.submit-alt{
  background:var(--bg-c);border:1px solid var(--border);color:var(--text-3);
  cursor:not-allowed;
}
.submit-alt:hover{background:var(--bg-c);box-shadow:none;}
.divider{
  display:flex;align-items:center;gap:10px;margin:20px 0;
  font-size:.72rem;color:var(--text-3);
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.foot{text-align:center;font-size:.8rem;color:var(--text-2);margin-top:18px;}
.foot a{color:var(--indigo);text-decoration:none;cursor:pointer;}
.note{
  margin-top:20px;padding:10px 12px;border-radius:8px;
  background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.15);
  font-size:.72rem;color:#F59E0B;line-height:1.6;
}
.error-msg{
  margin-top:14px;padding:10px 12px;border-radius:8px;
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);
  font-size:.78rem;color:#FCA5A5;display:none;
}
.success-msg{
  margin-top:14px;padding:10px 12px;border-radius:8px;
  background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);
  font-size:.78rem;color:#86EFAC;display:none;
}
#nameField{display:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">UNIEX <em>AI</em></div>
  <h1 id="formTitle">Welcome back</h1>
  <p class="sub" id="formSub">Log in to continue your exam prep</p>

  <div class="field" id="nameField">
    <label>Name</label>
    <input type="text" id="name" placeholder="Your name">
  </div>
  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@college.edu">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="At least 8 characters">
  </div>
  <button class="submit" id="submitBtn">Log in →</button>
  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <div class="divider">OR</div>
  <button class="submit submit-alt" title="Coming soon — not built yet">
    Continue with Google (coming soon)
  </button>

  <p class="foot" id="toggleText">New here? <a id="toggleLink">Create a free account</a></p>

  <div class="note" id="modeNote"></div>
</div>

<script>
// Same CONFIG pattern as app.html — both must stay in sync.
const CONFIG = {
  API_BASE_URL: "https://uniex-ai.onrender.com",
  DEMO_MODE: false
};

document.getElementById('modeNote').textContent = CONFIG.DEMO_MODE
  ? "⚠️ Demo mode — auth backend not connected. Logging in drops you into the app directly."
  : "⚠️ UniExamAI is in active development — accounts and features may have occasional bugs. Thanks for testing it early.";

let mode = 'login'; // or 'signup'

function getDeviceId() {
  const raw = [
    navigator.userAgent,
    screen.width + 'x' + screen.height,
    Intl.DateTimeFormat().resolvedOptions().timeZone
  ].join('|');
  let hash = 0;
  for (let i = 0; i < raw.length; i++) {
    hash = (hash << 5) - hash + raw.charCodeAt(i);
    hash |= 0;
  }
  return 'dev_' + Math.abs(hash);
}

function showError(msg) {
  document.getElementById('successMsg').style.display = 'none';
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function showSuccess(msg) {
  document.getElementById('errorMsg').style.display = 'none';
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';

  if (mode === 'signup') {
    document.getElementById('formTitle').textContent = 'Create your account';
    document.getElementById('formSub').textContent = 'Free to start — upgrade anytime';
    document.getElementById('nameField').style.display = 'block';
    document.getElementById('submitBtn').textContent = 'Create account →';
    document.getElementById('toggleText').innerHTML = 'Already have an account? <a id="toggleLink">Log in</a>';
  } else {
    document.getElementById('formTitle').textContent = 'Welcome back';
    document.getElementById('formSub').textContent = 'Log in to continue your exam prep';
    document.getElementById('nameField').style.display = 'none';
    document.getElementById('submitBtn').textContent = 'Log in →';
    document.getElementById('toggleText').innerHTML = 'New here? <a id="toggleLink">Create a free account</a>';
  }
  document.getElementById('toggleLink').addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));
}

async function handleSubmit() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const name = document.getElementById('name').value.trim();

  if (!email || !password) {
    showError('Please enter both email and password.');
    return;
  }
  if (mode === 'signup' && password.length < 8) {
    showError('Password must be at least 8 characters.');
    return;
  }

  if (CONFIG.DEMO_MODE) {
    window.location.href = 'app.html';
    return;
  }

  const endpoint = mode === 'signup' ? '/api/auth/register' : '/api/auth/login';
  const body = mode === 'signup'
    ? { email, password, name, deviceId: getDeviceId() }
    : { email, password, deviceId: getDeviceId() };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = mode === 'signup' ? 'Creating account…' : 'Logging in…';

  try {
    const res = await fetch(`${CONFIG.API_BASE_URL}${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (!res.ok) {
      showError(data.error || (mode === 'signup' ? 'Could not create account.' : 'Login failed.'));
      btn.disabled = false;
      btn.textContent = mode === 'signup' ? 'Create account →' : 'Log in →';
      return;
    }

    // NOTE: localStorage persists across browser restarts — this is what
    // keeps you logged in. For stronger production security against XSS
    // token theft, the backend should eventually issue this as an httpOnly
    // secure cookie instead, so client-side JS can never read it directly.
    localStorage.setItem('uniexai_token', data.token);

    if (mode === 'signup') {
      showSuccess('Account created! Redirecting…');
    }
    setTimeout(() => { window.location.href = 'app.html'; }, mode === 'signup' ? 800 : 0);
  } catch (err) {
    showError('Could not reach the server. Please try again.');
    btn.disabled = false;
    btn.textContent = mode === 'signup' ? 'Create account →' : 'Log in →';
  }
}

document.getElementById('submitBtn').addEventListener('click', handleSubmit);
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSubmit();
});

setMode('login');
</script>
</body>
</html>
